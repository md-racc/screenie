[package]
name = "screenie"
description = "Keyboard-driven screenshots for Wayland: select, annotate, redact, measure and OCR a frozen frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "../../../README.md"
keywords = ["screenshot", "wayland", "hyprland", "annotation", "ocr"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
jiff = "0.2"
lexopt = "0.3"
screenie-core.workspace = true
screenie-image.workspace = true
screenie-platform.workspace = true
serde_json = "1"
signal-hook = "0.4.5"
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
fontdue = "0.9"
