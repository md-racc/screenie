[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
screenie-core = { path = "crates/screenie-core" }
screenie-image = { path = "crates/screenie-image" }
screenie-platform = { path = "crates/screenie-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
